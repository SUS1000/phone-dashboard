<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B4A80">
<title>שיחות</title>
<style>
:root{--navy:#0B4A80;--sky:#2F8DB8;--bg:#F5F8FA;--card:#fff;--text:#14283C;--muted:#5E7184;--line:#D9E2EA;--ok:#1E7D4F;--bad:#B3261E;--note:#FFF6DB}
@media (prefers-color-scheme:dark){:root{--navy:#9CC3EA;--sky:#4FA9D3;--bg:#0F1923;--card:#16222E;--text:#E4ECF3;--muted:#9AAEC0;--line:#2A3A4A;--ok:#5CC28E;--bad:#F08A80;--note:#2E2A1C}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 Arial,sans-serif;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:0 0 12px;color:var(--navy)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:20px;font-weight:700;background:var(--sky);color:#fff;text-align:center;text-decoration:none;margin:10px 0}
.btn.sec{background:var(--card);color:var(--navy);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.name{font-size:20px;font-weight:700}
.pts{background:var(--note);border-radius:10px;padding:10px;margin:8px 0;font-size:18px;white-space:pre-wrap}
.muted{color:var(--muted);font-size:15px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
#log{font-size:14px;color:var(--muted);white-space:pre-wrap;margin-top:16px}
</style>
</head>
<body>
<h1>שיחות · עמוד ניסיון</h1>
<div id="app"><p class="muted">טוען…</p></div>
<div id="log"></div>
<script>
// Phone app probe. Talks to Microsoft To Do (Graph) for a personal Microsoft account only.
// No data is stored in this code or in the repository: everything lives in the user's To Do.
const CLIENT_ID = "5353ab82-7429-41f9-aa9a-11c30b734e65";
const AUTH = "https://login.microsoftonline.com/consumers/oauth2/v2.0";
const SCOPES = "Tasks.ReadWrite offline_access openid";
const REDIRECT = location.origin + location.pathname;
const LIST_NAME = "שיחות";
const $ = s => document.querySelector(s);
const log = m => { $("#log").textContent += m + "\n"; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem("pd_" + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("pd_" + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("pd_" + k); } catch {} }
};

// ---------- sign-in: authorization code + PKCE, no library ----------
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const randomStr = n => b64url(crypto.getRandomValues(new Uint8Array(n)));
async function login(silent) {
  const verifier = randomStr(48), state = randomStr(16);
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  sessionStorage.setItem("pd_pkce", JSON.stringify({ verifier, state, silent: !!silent }));
  const q = new URLSearchParams({ client_id: CLIENT_ID, response_type: "code", redirect_uri: REDIRECT, scope: SCOPES,
    code_challenge: challenge, code_challenge_method: "S256", state, response_mode: "query" });
  if (silent) q.set("prompt", "none");
  location.assign(AUTH + "/authorize?" + q);
}
// every network call says which step failed, so a phone screenshot is enough to diagnose
async function step(name, fn) {
  try { return await fn(); }
  catch (e) {
    const net = e instanceof TypeError;
    const msg = `שלב: ${name} · ${net ? "הבקשה נחסמה או שאין רשת" : "תשובת שגיאה"} · ${e.message}${navigator.onLine === false ? " · אין חיבור לאינטרנט" : ""}`;
    store.set("lastErr", { at: new Date().toISOString(), msg });
    throw Object.assign(new Error(msg), { code: e.code });
  }
}
async function tokenRequest(params) {
  return step(params.grant_type === "refresh_token" ? "רענון התחברות" : "קבלת הרשאה ממיקרוסופט", () => tokenRequestRaw(params));
}
async function tokenRequestRaw(params) {
  const r = await fetch(AUTH + "/token", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ client_id: CLIENT_ID, redirect_uri: REDIRECT, scope: SCOPES, ...params }) });
  const j = await r.json();
  if (!r.ok) throw Object.assign(new Error(j.error_description || j.error || "token error"), { code: j.error });
  store.set("tok", { at: j.access_token, rt: j.refresh_token, exp: Date.now() + (j.expires_in - 120) * 1000 });
  return j.access_token;
}
async function handleRedirect() {
  const p = new URLSearchParams(location.search);
  if (!p.has("code") && !p.has("error")) return false;
  const saved = JSON.parse(sessionStorage.getItem("pd_pkce") || "{}");
  sessionStorage.removeItem("pd_pkce");
  history.replaceState(null, "", REDIRECT);
  if (p.get("error")) {
    if (saved.silent) { log("כניסה שקטה לא הצליחה: " + p.get("error")); return "needLogin"; }
    throw new Error(p.get("error_description") || p.get("error"));
  }
  if (p.get("state") !== saved.state) throw new Error("state mismatch");
  await tokenRequest({ grant_type: "authorization_code", code: p.get("code"), code_verifier: saved.verifier });
  return true;
}
async function token() {
  const t = store.get("tok");
  if (t && t.at && Date.now() < t.exp) return t.at;
  if (t && t.rt) {
    try { return await tokenRequest({ grant_type: "refresh_token", refresh_token: t.rt }); }
    catch (e) { log("רענון נכשל: " + e.message); }
  }
  return null;
}
async function graph(path, opts = {}) {
  const at = await token();
  if (!at) throw Object.assign(new Error("not signed in"), { code: "login" });
  return step("To Do " + (opts.method || "GET") + " " + path.split("?")[0].replace(/\/[A-Za-z0-9_=-]{20,}/g, "/…"), () => graphRaw(path, opts, at));
}
// To Do on a personal account is slow at times and answers 504/503/429. Every call gets a time limit and up to 3 tries.
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function graphRaw(path, opts, at) {
  const url = path.startsWith("https://") ? path : "https://graph.microsoft.com/v1.0" + path;
  let last;
  for (let i = 0; i < 3; i++) {
    const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 30000);
    try {
      const r = await fetch(url, { ...opts, signal: ac.signal,
        headers: { Authorization: "Bearer " + at, ...(opts.body ? { "Content-Type": "application/json" } : {}), ...(opts.headers || {}) } });
      clearTimeout(timer);
      if (r.status === 204) return null;
      const j = await r.json().catch(() => ({}));
      if (r.ok) return j;
      last = new Error((j.error && j.error.message) || ("HTTP " + r.status));
      if (![429, 500, 502, 503, 504].includes(r.status) || (opts.method && opts.method !== "GET" && r.status !== 429)) throw last;
      const wait = +(r.headers.get("Retry-After") || 0) * 1000;
      status(`To Do איטי כרגע, מנסה שוב (${i + 2} מתוך 3)…`);
      await sleep(wait || [2000, 5000, 0][i]);
    } catch (e) {
      clearTimeout(timer);
      if (e === last) throw e;
      last = e.name === "AbortError" ? new Error("To Do לא ענה תוך 30 שניות") : e;
      if (opts.method && opts.method !== "GET") throw last;
      status(`To Do לא ענה, מנסה שוב (${i + 2} מתוך 3)…`);
      await sleep([2000, 5000, 0][i]);
    }
  }
  throw last;
}
// all pages of a collection, no query options (To Do on personal accounts fails with some of them)
async function graphAll(path) {
  let out = [], next = path, n = 0;
  while (next && n++ < 30) { const j = await graph(next); out = out.concat(j.value || []); next = j["@odata.nextLink"]; }
  return out;
}
function status(t) { const s = $("#status"); if (s) s.textContent = t || ""; }

// ---------- calls ----------
// Task titles from the dashboard sync look like "name · phone · what to say".
function parseCall(t) {
  const parts = (t.title || "").split(" · ");
  const body = (t.body && t.body.content) || "";
  const phone = (parts.find(s => /^[+\d][\d\s\-()]{6,}$/.test(s.trim())) || (body.match(/\+?\d[\d\s\-]{7,}\d/) || [""])[0]).trim();
  const name = parts[0] || "";
  const points = parts.filter(s => s !== parts[0] && s.trim() !== phone).join("\n").replace(/ \/ /g, "\n");
  return { id: t.id, name, phone, points };
}
const telHref = p => "tel:" + p.replace(/[^\d+]/g, "");

function renderCalls(calls, note) {
  $("#app").innerHTML = `<p id="status" class="muted">${esc(note || "")}</p>
    <button class="btn sec" id="wtest">בדיקת כתיבה ל־To Do</button><p id="wres" class="muted"></p>
    ${calls.map(c => `<div class="card"><div class="name">${esc(c.name)}</div>
      ${c.points ? `<div class="pts">${esc(c.points)}</div>` : ""}
      ${c.phone ? `<a class="btn" href="${esc(telHref(c.phone))}">חיוג · ${esc(c.phone)}</a>` : `<p class="muted">אין מספר טלפון</p>`}</div>`).join("")}`;
}
async function load() {
  // show the last list at once; refresh it from To Do behind it
  const cached = store.get("calls");
  if (cached) renderCalls(cached.calls, "מעדכן מ־To Do…"); else $("#app").innerHTML = `<p id="status" class="muted">מתחבר ל־To Do…</p>`;
  let listId = store.get("listId");
  if (!listId) {
    status("מחפש את הרשימה \"" + LIST_NAME + "\"…");
    const lists = await graphAll("/me/todo/lists");
    const list = lists.find(l => l.displayName === LIST_NAME);
    if (!list) { $("#app").innerHTML = `<p class="bad">לא נמצאה רשימה בשם "${esc(LIST_NAME)}" ב־To Do.</p><p class="muted">רשימות שנמצאו: ${esc(lists.map(l => l.displayName).join(", "))}</p>`; return; }
    listId = list.id; store.set("listId", listId);
  }
  status("קורא את השיחות…");
  let tasks;
  try { tasks = await graphAll(`/me/todo/lists/${listId}/tasks`); }
  catch (e) { if (/404|not found/i.test(e.message)) store.del("listId"); throw e; }
  const calls = tasks.filter(t => t.status !== "completed").map(parseCall);
  store.set("calls", { at: Date.now(), calls });
  renderCalls(calls, `מחובר. ${calls.length} שיחות פתוחות.`);
  const list = { id: listId };
  $("#wtest").onclick = async () => {
    $("#wres").textContent = "בודק…";
    try {
      const t = await graph(`/me/todo/lists/${list.id}/tasks`, { method: "POST", body: JSON.stringify({ title: "בדיקת כתיבה מהאפליקציה (נמחקת מיד)" }) });
      await graph(`/me/todo/lists/${list.id}/tasks/${t.id}`, { method: "DELETE" });
      $("#wres").innerHTML = `<span class="ok">הכתיבה עובדת: נוצרה משימה ונמחקה.</span>`;
    } catch (e) { $("#wres").innerHTML = `<span class="bad">הכתיבה נכשלה: ${esc(e.message)}</span>`; }
  };
}
function showLogin(msg) {
  $("#app").innerHTML = `${msg ? `<p class="muted">${esc(msg)}</p>` : ""}<button class="btn" id="li">כניסה עם החשבון של To Do</button>
    <p class="muted">להתחבר עם החשבון האישי (ganzelu@gmail.com), זה שמחובר ל־To Do.</p>`;
  $("#li").onclick = () => login(false);
}
(async () => {
  try {
    const r = await handleRedirect();
    if (r === "needLogin") return showLogin("צריך להתחבר שוב.");
    if (!(await token())) {
      if (store.get("tok")) return login(true); // had a session: try a silent redirect first
      return showLogin();
    }
    await load();
  } catch (e) {
    if (e.code === "login") return showLogin();
    $("#app").innerHTML = `<p class="bad">תקלה: ${esc(e.message)}</p><button class="btn" id="relog">כניסה מחדש</button><button class="btn sec" onclick="location.reload()">נסה שוב</button>`;
    $("#relog").onclick = () => { store.del("tok"); login(false); };
  }
})();
</script>
</body>
</html>

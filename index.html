<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B4A80">
<title>שיחות ומשימות</title>
<style>
:root{--navy:#0B4A80;--sky:#2F8DB8;--bg:#F5F8FA;--card:#fff;--text:#14283C;--muted:#5E7184;--line:#D9E2EA;--ok:#1E7D4F;--bad:#B3261E;--note:#FFF6DB;--urg:#B3261E}
@media (prefers-color-scheme:dark){:root{--navy:#9CC3EA;--sky:#4FA9D3;--bg:#0F1923;--card:#16222E;--text:#E4ECF3;--muted:#9AAEC0;--line:#2A3A4A;--ok:#5CC28E;--bad:#F08A80;--note:#2E2A1C;--urg:#F08A80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 Arial,sans-serif;padding:12px 14px calc(84px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:0 0 8px;color:var(--navy)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:19px;font-weight:700;background:var(--sky);color:#fff;text-align:center;text-decoration:none;margin:8px 0;cursor:pointer;font-family:inherit}
.btn.sec{background:var(--card);color:var(--navy);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.row3 .btn{font-size:16px;padding:13px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.item{display:flex;gap:10px;align-items:center;cursor:pointer}
.item .t{flex:1;min-width:0}.item .n{font-weight:700;font-size:18px}.item .s{color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:none;font-size:18px;color:var(--ok);cursor:pointer}
.urg{color:var(--urg);font-weight:700}
.name{font-size:26px;font-weight:700;color:var(--navy);margin:4px 0}
.pts{background:var(--note);border-radius:12px;padding:12px;margin:10px 0;font-size:21px;white-space:pre-wrap;line-height:1.45}
.muted{color:var(--muted);font-size:15px}.ok{color:var(--ok)}.bad{color:var(--bad)}
label{display:block;font-size:15px;color:var(--muted);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:9px 14px;font-size:16px;font-family:inherit;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;padding:12px 4px;font:inherit;font-size:16px;color:var(--muted);cursor:pointer}
nav button.on{color:var(--navy);font-weight:700;border-top:3px solid var(--navy)}
#bar{font-size:14px;color:var(--muted);min-height:20px}
#bar.bad{color:var(--bad)}
.toast{position:fixed;bottom:80px;left:16px;right:16px;background:var(--navy);color:#fff;border-radius:12px;padding:12px;text-align:center;font-size:16px}
</style>
</head>
<body>
<div id="bar"></div>
<div id="app"></div>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
// Phone app for the dashboard. Data lives in one Google Sheet that this app creates in the user's Drive
// (scope drive.file: the app sees only its own file). No data is kept in this code or in the repository.
const CLIENT_ID = "321473034890-1dufe73vfee111v4jidjeot1pi0rvob2.apps.googleusercontent.com";
const SCOPE = "https://www.googleapis.com/auth/drive.file";
const SHEET_NAME = "Phone dashboard data";
const COLS = ["id", "type", "title", "phone", "points", "status", "outcome", "due", "urgent", "createdAt", "updatedAt", "source", "dashId"];
const TYPES = { call: "שיחה", task: "משימה", waiting: "ממתין", agenda: "לישיבה עם משה" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem("pa_" + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("pa_" + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("pa_" + k); } catch {} }
};
const pad = n => String(n).padStart(2, "0");
const isoDay = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => isoDay(new Date());
const tomorrow = () => { const d = new Date(); d.setDate(d.getDate() + 1); return isoDay(d); };
const stamp = () => new Date().toISOString();
const S = { tab: store.get("tab") || "calls", items: (store.get("items") || []), open: null, form: store.get("draft") || { type: "call" }, busy: false, loaded: false };

function bar(t, bad) { const b = $("#bar"); b.textContent = t || ""; b.className = bad ? "bad" : ""; }
let toastT;
function toast(t) { $("#toast").innerHTML = `<div class="toast" role="status">${esc(t)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => $("#toast").innerHTML = "", 2500); }

// ---------- Google sign-in (token lasts an hour; renewing needs a tap, so every action goes through withToken) ----------
let tokenClient = null, pending = [];
function gisReady() { return !!(window.google && google.accounts && google.accounts.oauth2); }
function initGis() {
  if (tokenClient || !gisReady()) return !!tokenClient;
  tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPE, callback: r => {
    const q = pending; pending = [];
    if (r && r.access_token) { store.set("tok", { t: r.access_token, exp: Date.now() + (r.expires_in - 120) * 1000 }); store.set("granted", true); q.forEach(p => p.ok(r.access_token)); }
    else q.forEach(p => p.fail(new Error((r && (r.error_description || r.error)) || "ההתחברות לא הושלמה")));
  }, error_callback: e => { const q = pending; pending = []; q.forEach(p => p.fail(new Error(e && e.type === "popup_closed" ? "חלון ההתחברות נסגר" : "חלון ההתחברות נחסם או נכשל"))); } });
  return true;
}
const validToken = () => { const t = store.get("tok"); return t && Date.now() < t.exp ? t.t : null; };
// must be called from a click: if the token is old, this opens Google's small window
function getToken() {
  const t = validToken(); if (t) return Promise.resolve(t);
  if (!initGis()) return Promise.reject(new Error("רכיב ההתחברות של גוגל עוד לא נטען. נסה שוב בעוד רגע."));
  return new Promise((ok, fail) => { pending.push({ ok, fail }); tokenClient.requestAccessToken({ prompt: store.get("granted") ? "" : "consent" }); });
}

// ---------- Google API calls, with a time limit and retries ----------
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function api(url, opts = {}, stepName) {
  let last;
  for (let i = 0; i < 3; i++) {
    const tok = await getToken();
    const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 25000);
    try {
      const r = await fetch(url, { ...opts, signal: ac.signal, headers: { Authorization: "Bearer " + tok, ...(opts.body ? { "Content-Type": "application/json" } : {}) } });
      clearTimeout(timer);
      const j = await r.json().catch(() => ({}));
      if (r.ok) return j;
      if (r.status === 401) { store.del("tok"); last = new Error("ההתחברות פגה"); throw Object.assign(last, { relogin: true }); }
      last = new Error((j.error && (j.error.message || j.error)) || "HTTP " + r.status);
      if (![429, 500, 502, 503, 504].includes(r.status)) throw last;
    } catch (e) {
      clearTimeout(timer);
      if (e.relogin || e === last && !/HTTP 5|429/.test(e.message)) throw Object.assign(new Error(`שלב: ${stepName} · ${e.message}`), { relogin: e.relogin });
      last = e.name === "AbortError" ? new Error("גוגל לא ענה תוך 25 שניות") : e;
    }
    bar(`גוגל איטי כרגע, מנסה שוב (${i + 2} מתוך 3)…`);
    await sleep([1500, 4000, 0][i]);
  }
  throw new Error(`שלב: ${stepName} · ${last.message}`);
}
const SHEETS = "https://sheets.googleapis.com/v4/spreadsheets";
async function sheetId() {
  let id = store.get("sheetId"); if (id) return id;
  bar("מחפש את גיליון הנתונים…");
  const q = encodeURIComponent(`name='${SHEET_NAME}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`);
  const found = await api(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {}, "חיפוש הגיליון ב־Drive");
  if (found.files && found.files.length) id = found.files[0].id;
  else {
    bar("יוצר גיליון נתונים חדש…");
    const created = await api(SHEETS, { method: "POST", body: JSON.stringify({ properties: { title: SHEET_NAME }, sheets: [{ properties: { title: "items" } }] }) }, "יצירת הגיליון");
    id = created.spreadsheetId;
    await api(`${SHEETS}/${id}/values/items!A1:M1?valueInputOption=RAW`, { method: "PUT", body: JSON.stringify({ values: [COLS] }) }, "כותרות הגיליון");
  }
  store.set("sheetId", id); return id;
}
const toRow = it => COLS.map(c => it[c] == null ? "" : String(it[c]));
const fromRow = (r, i) => { const o = { _row: i + 2 }; COLS.forEach((c, k) => o[c] = r[k] ?? ""); o.urgent = o.urgent === "true"; return o; };
async function loadAll() {
  const id = await sheetId();
  bar("קורא מהגיליון…");
  const j = await api(`${SHEETS}/${id}/values/items!A2:M`, {}, "קריאת הגיליון");
  S.items = (j.values || []).map(fromRow).filter(x => x.id);
  store.set("items", S.items); S.loaded = true;
  bar("מעודכן " + new Date().toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" }));
}
async function addItem(it) {
  const id = await sheetId();
  it.id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  it.status = "open"; it.createdAt = it.updatedAt = stamp(); it.source = "phone";
  const r = await api(`${SHEETS}/${id}/values/items!A1:M1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`, { method: "POST", body: JSON.stringify({ values: [toRow(it)] }) }, "הוספה לגיליון");
  const m = r.updates && r.updates.updatedRange && r.updates.updatedRange.match(/!A(\d+)/); it._row = m ? +m[1] : null;
  S.items.push(it); store.set("items", S.items);
}
async function saveItem(it, patch) {
  const id = await sheetId();
  if (!it._row) await loadAll();
  const cur = S.items.find(x => x.id === it.id) || it;
  Object.assign(cur, patch, { updatedAt: stamp() });
  await api(`${SHEETS}/${id}/values/items!A${cur._row}:M${cur._row}?valueInputOption=RAW`, { method: "PUT", body: JSON.stringify({ values: [toRow(cur)] }) }, "עדכון בגיליון");
  store.set("items", S.items);
}

// ---------- screens ----------
const openItems = t => S.items.filter(x => x.status !== "done" && (!t || t.includes(x.type)))
  .sort((a, b) => (b.urgent - a.urgent) || ((a.due || "9") > (b.due || "9") ? 1 : -1) || (a.createdAt > b.createdAt ? 1 : -1));
const telHref = p => "tel:" + String(p).replace(/[^\d+]/g, "");
const firstLine = s => String(s || "").split("\n")[0];
const dueLabel = d => !d ? "" : d === today() ? "היום" : d === tomorrow() ? "מחר" : d < today() ? "באיחור" : d.slice(8, 10) + "." + d.slice(5, 7);
function listRow(x) {
  const sub = [x.urgent ? `<span class="urg">דחוף</span>` : "", dueLabel(x.due), x.type === "waiting" && x.phone ? "מ: " + esc(x.phone) : "", esc(firstLine(x.points))].filter(Boolean).join(" · ");
  return `<div class="card item" data-open="${esc(x.id)}"><button class="chk" data-done="${esc(x.id)}" aria-label="סימון בוצע">✓</button>
    <div class="t"><div class="n">${esc(x.title)}${x.type === "call" && !x.phone ? ' <span class="muted">· אין מספר</span>' : ""}</div><div class="s">${sub}</div></div></div>`;
}
function renderList(types, empty) {
  const l = openItems(types);
  return l.length ? l.map(listRow).join("") : `<p class="muted">${empty}</p>`;
}
function renderCall(x) {
  return `<button class="btn sec" data-back>→ לרשימה</button>
    <div class="name">${esc(x.title)}</div>
    ${x.urgent || x.due ? `<div class="muted">${x.urgent ? '<span class="urg">דחוף</span> ' : ""}${esc(dueLabel(x.due))}</div>` : ""}
    ${x.points ? `<div class="pts">${esc(x.points)}</div>` : `<p class="muted">לא נכתב מה להגיד.</p>`}
    ${x.phone ? `<a class="btn" href="${esc(telHref(x.phone))}" data-dial="${esc(x.id)}">חיוג · ${esc(x.phone)}</a>` : `<label>מספר טלפון</label><input id="c_phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="להוסיף מספר"><button class="btn sec" data-setphone="${esc(x.id)}">שמירת המספר</button>`}
    <label for="c_out">מה סוכם</label><textarea id="c_out" rows="3">${esc(x.outcome)}</textarea>
    <div class="row3"><button class="btn ok" data-calldone="${esc(x.id)}">בוצע ✓</button><button class="btn sec" data-noanswer="${esc(x.id)}">לא ענה</button><button class="btn sec" data-tomorrow="${esc(x.id)}">למחר</button></div>`;
}
function renderTask(x) {
  return `<button class="btn sec" data-back>→ לרשימה</button>
    <div class="muted">${esc(TYPES[x.type] || "")}</div><div class="name">${esc(x.title)}</div>
    ${x.type === "waiting" && x.phone ? `<div class="muted">מ: ${esc(x.phone)}</div>` : ""}
    ${x.points ? `<div class="pts">${esc(x.points)}</div>` : ""}
    <label for="c_out">הערה</label><textarea id="c_out" rows="3">${esc(x.outcome)}</textarea>
    <div class="row3"><button class="btn ok" data-calldone="${esc(x.id)}">${x.type === "waiting" ? "התקבל ✓" : "בוצע ✓"}</button><button class="btn sec" data-tomorrow="${esc(x.id)}">למחר</button><button class="btn sec" data-savenote="${esc(x.id)}">שמירה</button></div>
    ${x.type === "waiting" ? `<button class="btn sec" data-tocall="${esc(x.id)}">להתקשר בנושא</button>` : ""}`;
}
function renderAdd() {
  const f = S.form, t = f.type || "call";
  const titleLabel = t === "call" ? "למי להתקשר" : t === "waiting" ? "מה מחכה" : t === "agenda" ? "הנושא" : "מה לעשות";
  return `<h1>הוספה</h1>
    <div class="chips">${Object.entries(TYPES).map(([k, v]) => `<button class="chip ${t === k ? "on" : ""}" data-type="${k}">${v}</button>`).join("")}</div>
    <label for="f_title">${titleLabel}</label><input id="f_title" value="${esc(f.title)}" autocomplete="off">
    ${t === "call" ? `<label for="f_phone">טלפון</label><input id="f_phone" type="tel" inputmode="tel" autocomplete="tel" value="${esc(f.phone)}">` : ""}
    ${t === "waiting" ? `<label for="f_phone">ממי</label><input id="f_phone" value="${esc(f.phone)}">` : ""}
    <label for="f_points">${t === "call" ? "מה להגיד" : "פירוט"}</label><textarea id="f_points" rows="4">${esc(f.points)}</textarea>
    <div class="chips"><button class="chip ${f.urgent ? "on" : ""}" data-flip="urgent">דחוף</button><button class="chip ${f.due === today() ? "on" : ""}" data-due="${today()}">להיום</button><button class="chip ${f.due === tomorrow() ? "on" : ""}" data-due="${tomorrow()}">למחר</button></div>
    <button class="btn" data-add ${S.busy ? "disabled" : ""}>${S.busy ? "שומר…" : "הוספה"}</button>
    <p class="muted">להכתבה: כפתור המיקרופון במקלדת.</p>`;
}
function render() {
  const tabs = [["add", "הוספה"], ["calls", "שיחות"], ["tasks", "משימות"], ["waiting", "ממתין"]];
  $("#nav").innerHTML = tabs.map(([k, v]) => `<button class="${S.tab === k && !S.open ? "on" : ""}" data-tab="${k}">${v}${k !== "add" ? ` (${openItems(k === "calls" ? ["call"] : k === "tasks" ? ["task", "agenda"] : ["waiting"]).length})` : ""}</button>`).join("");
  if (!store.get("granted")) { $("#app").innerHTML = `<h1>שיחות ומשימות</h1><p>כדי להתחיל, להתחבר עם חשבון הגוגל <b>ganzelu@gmail.com</b>. גוגל יציג "האפליקציה לא אומתה": זה צפוי, כי היא פרטית. לוחצים "המשך" ומאשרים.</p><button class="btn" data-login>התחברות עם גוגל</button>`; return; }
  const open = S.open && S.items.find(x => x.id === S.open);
  if (open) { $("#app").innerHTML = open.type === "call" ? renderCall(open) : renderTask(open); return; }
  $("#app").innerHTML = S.tab === "add" ? renderAdd()
    : S.tab === "calls" ? `<h1>שיחות</h1>${renderList(["call"], "אין שיחות פתוחות.")}`
    : S.tab === "tasks" ? `<h1>משימות</h1>${renderList(["task", "agenda"], "אין משימות פתוחות.")}`
    : `<h1>ממתין לאחרים</h1>${renderList(["waiting"], "אין פריטים.")}`;
}
function readForm() {
  const v = id => { const e = $("#" + id); return e ? e.value : undefined; };
  ["title", "phone", "points"].forEach(k => { const x = v("f_" + k); if (x !== undefined) S.form[k] = x; });
  store.set("draft", S.form);
}

// ---------- actions (each one is a tap, so a fresh token can be requested inside it) ----------
async function act(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); }
  catch (e) { if (e.relogin) store.del("tok"); bar(e.message, true); toast("לא נשמר: " + e.message); }
  render();
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-tab],[data-open],[data-done],[data-back],[data-type],[data-flip],[data-due],[data-add],[data-login],[data-calldone],[data-noanswer],[data-tomorrow],[data-savenote],[data-tocall],[data-setphone],[data-dial],[data-refresh]");
  if (!el) return;
  const d = el.dataset, find = id => S.items.find(x => x.id === id), note = () => ($("#c_out") || {}).value || "";
  if (d.tab) { if (S.tab === "add") readForm(); S.tab = d.tab; S.open = null; store.set("tab", d.tab); return render(); }
  if (d.done) { e.stopPropagation(); return act(() => saveItem(find(d.done), { status: "done" }), "סומן כבוצע"); }
  if (d.open) { S.open = d.open; return render(); }
  if ("back" in d) { S.open = null; return render(); }
  if (d.type) { readForm(); S.form.type = d.type; store.set("draft", S.form); return render(); }
  if (d.flip) { readForm(); S.form[d.flip] = !S.form[d.flip]; return render(); }
  if (d.due) { readForm(); S.form.due = S.form.due === d.due ? "" : d.due; return render(); }
  if ("login" in d) return act(async () => { await getToken(); await loadAll(); }, "מחובר");
  if ("refresh" in d) return act(loadAll);
  if ("add" in d) {
    readForm();
    if (!String(S.form.title || "").trim()) return toast("חסר " + (S.form.type === "call" ? "שם" : "תוכן"));
    S.busy = true; render();
    return act(async () => {
      try { await addItem({ type: S.form.type, title: S.form.title.trim(), phone: (S.form.phone || "").trim(), points: (S.form.points || "").trim(), urgent: !!S.form.urgent, due: S.form.due || "" });
        S.form = { type: S.form.type }; store.del("draft"); }
      finally { S.busy = false; }
    }, "נוסף");
  }
  if (d.dial) { store.set("dialed", { id: d.dial, at: Date.now() }); return; } // the tel: link itself opens the dialer
  if (d.calldone) return act(() => saveItem(find(d.calldone), { status: "done", outcome: note() }).then(() => { S.open = null; store.del("dialed"); }), "סומן כבוצע");
  if (d.noanswer) { const t = new Date(); const line = "לא ענה " + pad(t.getDate()) + "." + pad(t.getMonth() + 1) + " " + pad(t.getHours()) + ":" + pad(t.getMinutes()); const o = note(); return act(() => saveItem(find(d.noanswer), { outcome: (o ? o + "\n" : "") + line }).then(() => { S.open = null; store.del("dialed"); }), "נרשם: " + line); }
  if (d.tomorrow) return act(() => saveItem(find(d.tomorrow), { due: tomorrow(), outcome: note() }).then(() => { S.open = null; }), "נדחה למחר");
  if (d.savenote) return act(() => saveItem(find(d.savenote), { outcome: note() }), "נשמר");
  if (d.setphone) { const p = ($("#c_phone") || {}).value || ""; if (!p.trim()) return; return act(() => saveItem(find(d.setphone), { phone: p.trim() }), "המספר נשמר"); }
  if (d.tocall) { const w = find(d.tocall); S.form = { type: "call", title: w.phone || "", points: w.title }; S.tab = "add"; S.open = null; return render(); }
});
document.addEventListener("input", e => { if (/^f_/.test(e.target.id)) readForm(); });
// back from a call: open the card of the call that was dialed, ready for "what was agreed"
function backFromCall() {
  const d = store.get("dialed");
  if (!d || Date.now() - d.at > 6 * 3600e3) return;
  if (S.items.find(x => x.id === d.id && x.status !== "done")) { S.open = d.id; render(); const o = $("#c_out"); if (o) o.focus(); }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { backFromCall(); if (validToken()) loadAll().then(render).catch(() => {}); } });

// ---------- start: show the saved list at once, refresh from the sheet if the token is still valid ----------
render(); backFromCall();
if (store.get("granted")) {
  if (validToken()) loadAll().then(render).catch(e => bar(e.message, true));
  else bar(S.items.length ? "מוצג עותק שמור. כל לחיצה תעדכן מגוגל." : "", false);
  if (!validToken()) $("#bar").insertAdjacentHTML("beforeend", ` <button class="chip" data-refresh>רענון מגוגל</button>`);
}
</script>
<script src="https://accounts.google.com/gsi/client" async></script>
</body>
